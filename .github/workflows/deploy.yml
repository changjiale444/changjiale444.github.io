name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    env:
      ASTRO_SITE: ${{ vars.ASTRO_SITE || 'https://changjiale444.github.io' }}
      ASTRO_BASE: ${{ vars.ASTRO_BASE || '' }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Type-check
        run: yarn test:types
      - name: Lint
        run: yarn lint:ci
      - name: Unit tests
        run: yarn test
      - name: Build static website and search
        run: yarn build
      - name: Verify generated routes and public assets
        run: node scripts/verify-output.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
